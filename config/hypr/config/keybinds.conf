# Applications
$TERMINAL = kitty
$SHELL = fish
$EDITOR =   code
$EXPLORER = nautilus
$BROWSER =  zen-browser
$MENU =     rofi -show drun -name rofi
$DISCORD =  equicord

# Mouse
$RMB = mouse:272
$LMB = mouse:273
$MMB = mouse:274

# Scripts
$SPECIAL_WS = ~/.config/hypr/scripts/special.sh
$SCROLL_WS = ~/.config/hypr/scripts/scroll.sh

# AZERTY Layout
$1 = ampersand
$2 = eacute
$3 = quotedbl
$4 = apostrophe
$5 = parenleft
$6 = minus
$7 = egrave
$8 = underscore
$9 = ccedilla
$0 = agrave

# Shortcuts
bindd = SUPER, Q,       Open Kitty,             exec, $TERMINAL $SHELL
bindd = SUPER, T,       Open VSCode,            exec, $EDITOR
bindd = SUPER, E,       Open File Explorer,     exec, $EXPLORER
bindd = SUPER, B,       Open Browser,           exec, $BROWSER
bindd = SUPER, Super_L, Open Rofi Menu,         exec, $MENU
bindd = SUPER, D,       Open Discord,           exec, $SPECIAL_WS discord discord $DISCORD
bindd = SUPER, O,       Open OBS,               exec, $SPECIAL_WS obs com.obsproject.Studio obs
bindd = SUPER, S,       Open Spotify,           exec, $SPECIAL_WS spotify Spotify spotify
bindd = SUPER, G,       Open Steam,             exec, $SPECIAL_WS steam steam steam
bindd = SUPER,     Tab, Window Switcher,        exec, hyprctl dispatch focuswindow l
bindd = SUPER ALT, L,   Toggle Layout,          exec, hyprctl keyword general:layout master
bindd = SUPER,     C,   Kill active window,     killactive,
bindd = SUPER,     V,   Toggle floating window, exec, hyprctl dispatch togglefloating && hyprctl dispatch resizeactive exact 1400 800
bindd = SUPER,     F,   Toggle fullscreen,      fullscreen
bindd = SUPER SHIFT, C, Color picker,           exec, hyprpicker -a
bindd = SUPER SHIFT, V, Clipboard history,      exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bindd = SUPER SHIFT, R, Reload Hyprland,        exec, hyprctl reload
bind =            , Print,                      exec, grim /mnt/HDD/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png && satty --filename /mnt/HDD/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png
bind = SUPER SHIFT, S,                          exec, grim -g "$(slurp)" /mnt/HDD/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png && satty --filename /mnt/HDD/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png

# Window Management
bindm = SUPER, $RMB,       movewindow
bindm = SUPER, $LMB,       resizewindow
bind = SUPER,  left,       movefocus, l
bind = SUPER,  right,      movefocus, r
bind = SUPER,  up,         movefocus, u
bind = SUPER,  down,       movefocus, d
bind = SUPER,  mouse_down, exec, $SCROLL_WS up
bind = SUPER,  mouse_up,   exec, $SCROLL_WS down
bind = SUPER,       $1, workspace, 1
bind = SUPER,       $2, workspace, 2
bind = SUPER,       $3, workspace, 3
bind = SUPER,       $4, workspace, 4
bind = SUPER,       $5, workspace, 5
bind = SUPER,       $6, workspace, 6
bind = SUPER,       $7, workspace, 7
bind = SUPER,       $8, workspace, 8
bind = SUPER,       $9, workspace, 9
bind = SUPER,       $0, workspace, 10
bind = SUPER SHIFT, $1, movetoworkspace, 1
bind = SUPER SHIFT, $2, movetoworkspace, 2
bind = SUPER SHIFT, $3, movetoworkspace, 3
bind = SUPER SHIFT, $4, movetoworkspace, 4
bind = SUPER SHIFT, $5, movetoworkspace, 5
bind = SUPER SHIFT, $6, movetoworkspace, 6
bind = SUPER SHIFT, $7, movetoworkspace, 7
bind = SUPER SHIFT, $8, movetoworkspace, 8
bind = SUPER SHIFT, $9, movetoworkspace, 9
bind = SUPER SHIFT, $0, movetoworkspace, 10
bind = SUPER,       1, workspace, 1
bind = SUPER,       2, workspace, 2
bind = SUPER,       3, workspace, 3
bind = SUPER,       4, workspace, 4
bind = SUPER,       5, workspace, 5
bind = SUPER,       6, workspace, 6
bind = SUPER,       7, workspace, 7
bind = SUPER,       8, workspace, 8
bind = SUPER,       9, workspace, 9
bind = SUPER,       0, workspace, 10
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Media
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 2%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 2%-
bindl = , XF86AudioNext,          exec, playerctl next
bindl = , XF86AudioPause,         exec, playerctl play-pause
bindl = , XF86AudioPlay,          exec, playerctl play-pause
bindl = , XF86AudioPrev,          exec, playerctl previous

input {
    kb_layout = fr
    kb_options = caps:shiftlock
    numlock_by_default = false
    follow_mouse = 1
    scroll_factor = 1.0
    sensitivity = 0
    force_no_accel = 1
    repeat_rate = 25
    repeat_delay = 300
}

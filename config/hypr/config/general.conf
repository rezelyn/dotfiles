source = /home/lynn/.config/hypr/themes/catppuccin/mocha.conf

general {
    gaps_in = 10
    gaps_out = 20
    border_size = 2
    col.active_border = $lavender
    col.inactive_border = $mauve
    allow_tearing = false
    no_focus_fallback = false
    layout = dwindle
}

dwindle {
    preserve_split = 1
    pseudotile = 0
    special_scale_factor = 1.0
}

decoration {
    rounding = 12
    rounding_power = 2
    # active_opacity = 0.95
    # inactive_opacity = 0.75
    dim_inactive = true
    dim_strength = 0.15
 
    shadow {
        enabled = true
        range = 10
        render_power = 5
        color = $hl_shadow
    }
 
    blur {
        enabled = true
        size = 6
        passes = 2
        noise = 0
        vibrancy = 0.3
        special = 1
        popups = 1
    }
}

misc {
    force_default_wallpaper = 0
    disable_splash_rendering = 1
    disable_hyprland_logo = true
    background_color = $hl_background
    render_unfocused_fps = 0
    disable_autoreload = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    on_focus_under_fullscreen = 2
    initial_workspace_tracking = 1
    vfr = false
}

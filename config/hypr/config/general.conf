#########################
# GENERAL CONFIGURATION #
#########################

source = $THEME

general {
    gaps_in = 10
    gaps_out = 20
    border_size = 0
    col.active_border = $lavender
    col.inactive_border = $mauve
    allow_tearing = false
    layout = dwindle
}

dwindle {
    preserve_split = 1
}

decoration {
    rounding = 12
    rounding_power = 2
    dim_inactive = true
    dim_strength = 0.05
    active_opacity = 1
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 6
        render_power = 4
        color = $hl_shadow
    }

    blur {
        enabled = true
        size = 2
        passes = 2
        vibrancy = 0
        special = 1
        popups = 1
    }
}

misc {
    force_default_wallpaper = 0
    disable_splash_rendering = 1
    disable_hyprland_logo = true
    background_color = $hl_background
    render_unfocused_fps = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    on_focus_under_fullscreen = 2
    initial_workspace_tracking = 1
}

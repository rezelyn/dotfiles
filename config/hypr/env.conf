#############
# VARIABLES #
#############

# Applications
$TERMINAL = kitty
$SHELL    = fish
$EDITOR   = code
$EXPLORER = nautilus
$BROWSER  = firefox-developer-edition
$DRUN     = rofi -show drun -name rofi
$DISCORD  = discord

# Mouse
$LMB = mouse:272
$RMB = mouse:273
$MMB = mouse:274

# Scripts
$SPECIAL_WS = ~/.config/hypr/scripts/special.sh
$SCROLL_WS  = ~/.config/hypr/scripts/scroll.sh
$WALLPAPER  = ~/.config/hypr/scripts/wallpaper.sh

# Theme
$THEME = ~/.config/hypr/themes/catppuccin-mocha.conf


##########################
# ENVIRONEMENT VARIABLES #
##########################

# NVIDIA
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = NVD_BACKEND,direct
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_GSYNC_ALLOWED,1

# Electron Apps Fix
env = ELECTRON_OZONE_PLATFORM_HINT,x11
env = STEAM_DISABLE_XINPUT2_OVERRIDE_REDIRECT,1
